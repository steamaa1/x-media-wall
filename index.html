<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X 媒体墙</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#0e0f13;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header,.bar,.grid,footer{max-width:1300px;margin:auto}h1{font-size:22px;margin:5px 0}.sub{color:#9aa3b2;font-size:13px;margin-bottom:16px}.bar{position:sticky;top:8px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px;background:#171923;border:1px solid #292d3c;border-radius:14px;margin-bottom:14px}button,select{border:1px solid #363b4d;background:#212534;color:#eee;padding:9px 12px;border-radius:9px}button{cursor:pointer}button.on{background:#465c9f}.sp{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{position:relative;overflow:hidden;border-radius:14px;background:#1b1e29;border:1px solid #282d3c;aspect-ratio:3/4}.card img,.card video{width:100%;height:100%;object-fit:cover;display:block}.video .card{aspect-ratio:9/16}.video video{object-fit:contain;background:#050507}.tag{position:absolute;left:7px;bottom:7px;padding:3px 7px;border-radius:12px;background:#000a;font-size:10px}.light{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000e;padding:18px}.light.show{display:flex}.light img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:18px;top:10px;font-size:34px}.nav{position:absolute;top:48%;font-size:40px}.prev{left:15px}.next{right:15px}footer{padding-top:25px;text-align:center;color:#687083;font-size:12px}</style></head><body><header><h1>X 图片和视频媒体墙</h1><div class="sub"><a href="https://x.com/imengyuyzc" style="color:#8eabff">@imengyuyzc</a> + <a href="https://x.com/tianzhong_sub" style="color:#8eabff">@tianzhong_sub</a> · <b id="ic">0</b> 张图片 · <b id="vc">0</b> 个视频</div></header><div class="bar"><button id="all" class="on">全部图片</button><button id="rnd">随机图片</button><button id="vid">视频</button><button data-a="all" class="acct on">全部账号</button><button data-a="imeng" class="acct">@imengyuyzc</button><button data-a="tian" class="acct">@tianzhong_sub</button><select id="n"><option>6</option><option>12</option><option>24</option></select><button id="again">重新随机</button><span class="sp"></span><span id="count"></span></div><div id="grid" class="grid"></div><div id="light" class="light"><span id="close" class="close">×</span><span id="prev" class="nav prev">‹</span><img id="big"><span id="next" class="nav next">›</span></div><footer>媒体直接来源于 pbs.twimg.com / video.twimg.com，版权归原作者所有。</footer><script src="media.js"></script><script>const g=document.querySelector('#grid'),A=[...IMAGES.imeng,...IMAGES.tian],tag=new Map([...IMAGES.imeng.map(x=>[x,'@imengyuyzc']),...IMAGES.tian.map(x=>[x,'@tianzhong_sub'])]);let acct='all',mode='all',cur=[],bi=0;ic.textContent=A.length;vc.textContent=VIDEOS.length;function pool(){return acct==='all'?A:IMAGES[acct]}function active(id){document.querySelectorAll('#all,#rnd,#vid').forEach(x=>x.classList.remove('on'));document.querySelector(id).classList.add('on')}function render(a){g.className='grid';g.innerHTML='';cur=a;count.textContent=a.length+' 张';a.forEach((u,i)=>{let d=document.createElement('div');d.className='card';let m=u.match(/media\/([^?]+)/),im=new Image;im.loading='lazy';im.src='https://pbs.twimg.com/media/'+m[1]+'?format=jpg&name=medium';im.onclick=()=>open(i);d.append(im);let t=document.createElement('span');t.className='tag';t.textContent=tag.get(u);d.append(t);g.append(d)})}function showAll(){mode='all';active('#all');render([...pool()])}function random(){mode='random';active('#rnd');let a=[...pool()];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render(a.slice(0,+n.value))}function videos(){mode='video';active('#vid');g.className='grid video';g.innerHTML='';count.textContent=VIDEOS.length+' 个';VIDEOS.forEach(u=>{let d=document.createElement('div');d.className='card';let v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=u;d.append(v);g.append(d)})}function open(i){bi=i;big.src=cur[i];light.classList.add('show')}function step(x){bi=(bi+x+cur.length)%cur.length;big.src=cur[bi]}all.onclick=showAll;rnd.onclick=random;vid.onclick=videos;again.onclick=random;document.querySelectorAll('.acct').forEach(b=>b.onclick=()=>{acct=b.dataset.a;document.querySelectorAll('.acct').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode==='random'?random():showAll()});close.onclick=()=>light.classList.remove('show');prev.onclick=()=>step(-1);next.onclick=()=>step(1);light.onclick=e=>{if(e.target===light)light.classList.remove('show')};document.onkeydown=e=>{if(e.key==='Escape')light.classList.remove('show');if(light.classList.contains('show')&&e.key==='ArrowLeft')step(-1);if(light.classList.contains('show')&&e.key==='ArrowRight')step(1)};showAll();</script></body></html>
