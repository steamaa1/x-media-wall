<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#090a0c">
<title>X Media Archive</title>
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<header class="hero" id="top">
  <nav class="mast"><a class="brand" href="#top">XMW—01</a><span>私人数字影像档案</span><span class="mast-date">2026 / CN</span></nav>
  <div class="hero-grid">
    <div><p class="eyebrow"><i></i> 开放档案 · 双来源</p><h1><span>X MEDIA</span><span>ARCHIVE</span></h1></div>
    <div class="hero-meta"><p>来自两个 X 账号的<br>私人影像收藏。</p><dl><div><dt>IMAGES · 图片</dt><dd id="heroImages">000</dd></div><div><dt>MOTION · 影像</dt><dd id="heroVideos">00</dd></div><div><dt>SOURCES · 来源</dt><dd>02</dd></div></dl></div>
  </div>
  <a class="enter" href="#archive"><span>ENTER ARCHIVE · 进入档案</span><b>↓</b></a>
</header>
<main id="archive">
  <div class="archive-head">
    <div><p class="eyebrow"><i></i> 馆藏索引</p><h2>影像档案</h2></div>
    <p id="resultSummary">LOADING · 正在载入媒体索引…</p>
  </div>
  <div class="control-wrap">
    <div class="tabs" role="tablist"><button class="active" data-mode="all">01 / INDEX · 索引</button><button data-mode="random">02 / RANDOM · 随机</button><button data-mode="video">03 / MOTION · 视频</button></div>
    <div class="filters"><button class="active" data-account="all">全部 <span id="allCount">0</span></button><button data-account="imeng">IMENG账号 <span id="imengCount">0</span></button><button data-account="tian">TIAN账号 <span id="tianCount">0</span></button></div>
    <div class="views"><button class="active" data-view="flow" aria-label="瀑布流">FLOW · 瀑布流</button><button data-view="grid" aria-label="统一网格">GRID · 网格</button><button data-view="contact" aria-label="接触表">CONTACT · 接触表</button></div>
  </div>
  <section class="gallery flow" id="gallery" aria-live="polite"></section>
  <section class="gallery motion" id="motion" hidden></section>
  <div class="load-zone"><button id="loadMore">LOAD MORE · 加载更多 / <span>24</span></button><div id="sentinel"></div></div>
</main>
<button id="toTop" class="to-top" aria-label="返回顶部">↑</button>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="图片查看器" hidden>
  <header><span id="viewerNo">ARCHIVE · 档案 001</span><button id="closeViewer">ESC / CLOSE · 关闭</button></header>
  <button class="viewer-nav prev" id="prevImage">← <span>上一张</span></button><figure><div class="viewer-loading">DEVELOPING · 正在显影…</div><img id="viewerImage" alt=""></figure><button class="viewer-nav next" id="nextImage"><span>下一张</span> →</button>
  <footer><div><b id="viewerAccount">@账号</b><span id="viewerId">媒体 ID</span></div><div><button id="copyLink">复制链接</button><a id="openOriginal" target="_blank" rel="noopener">打开原图 ↗</a></div><progress id="viewerProgress" max="100" value="0"></progress></footer>
</div>
<footer class="site-footer"><div class="footer-mark">XMW—01</div><div>媒体来源 X / TWITTER<br>仅供私人浏览</div><div>由 GPT5.6-SOL 提供支持<br>仅供娱乐</div><div>© 2026</div></footer>
<script src="media.js?v=6"></script>
<script src="assets/js/app.js?v=2"></script>
</body>
</html>
